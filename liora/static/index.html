<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liora — AI Knowledge Intelligence Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: rgba(22, 27, 34, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-primary: #58a6ff;
            --accent-hover: #79c0ff;
            --gradient: linear-gradient(135deg, #58a6ff 0%, #bc8cff 100%);
            --error-color: #f85149;
            --success-color: #2ea043;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(88, 166, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(188, 140, 255, 0.08) 0%, transparent 50%);
        }

        .sidebar {
            width: 300px;
            background: var(--surface-color);
            border-right: 1px solid var(--surface-border);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: var(--gradient);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 18px;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .brand-text p {
            margin: 2px 0 0;
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .upload-section {
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--surface-border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        .upload-section:hover, .upload-section.dragover {
            border-color: var(--accent-primary);
            background: rgba(88, 166, 255, 0.05);
        }

        .upload-btn {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-top: 12px;
        }

        .upload-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .status-message {
            font-size: 13px;
            margin-top: 12px;
            min-height: 16px;
        }
        .status-success { color: var(--success-color); }
        .status-error { color: var(--error-color); }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
        }

        .user .message-bubble {
            background: var(--accent-primary);
            color: #000;
            border-bottom-right-radius: 4px;
        }

        .assistant .message-bubble {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-bottom-left-radius: 4px;
        }

        .sources {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .source-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .source-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .source-text {
            font-size: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-style: italic;
        }

        .input-area {
            padding: 24px 40px;
            background: transparent;
            display: flex;
            gap: 12px;
        }

        .input-box {
            flex: 1;
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 14px 24px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .input-box:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 24px;
            background: var(--gradient);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 8px;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: pulse 1.5s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand">
            <div class="logo">L</div>
            <div class="brand-text">
                <h1>Liora</h1>
                <p>Knowledge Intelligence</p>
            </div>
        </div>

        <div class="upload-section" id="uploadZone">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p style="font-size: 13px; color: var(--text-secondary); margin: 12px 0;">Drag & drop a PDF document or</p>
            <input type="file" id="fileInput" accept=".pdf" style="display: none;">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Browse Files</button>
            <div id="uploadStatus" class="status-message"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="message-bubble">
                    Hello! I'm Liora. Upload a document to the left, then ask me anything about it.
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="queryInput" class="input-box" placeholder="Ask a question about your documents..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendQuery()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // File Upload Handling
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadZone.addEventListener(eventName, () => uploadZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, () => uploadZone.classList.remove('dragover'), false);
        });

        uploadZone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        let activeFilename = null;

        async function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            if (file.type !== 'application/pdf') {
                showStatus('Please upload a PDF file.', false);
                return;
            }

            showStatus('Uploading and analyzing...', true);
            
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    activeFilename = data.filename;
                    showStatus(`Successfully ingested ${data.filename} (${data.chunks_added} chunks)`, true);
                    appendMessage('system', `Document "${data.filename}" has been analyzed and is ready for questions.`);
                } else {
                    showStatus(data.detail || 'Upload failed', false);
                }
            } catch (error) {
                showStatus('Network error during upload', false);
            }
        }

        function showStatus(message, isSuccess) {
            uploadStatus.textContent = message;
            uploadStatus.className = 'status-message ' + (isSuccess ? 'status-success' : 'status-error');
        }

        // Chat Handling
        const chatContainer = document.getElementById('chatContainer');
        const queryInput = document.getElementById('queryInput');

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendQuery();
            }
        }

        async function sendQuery() {
            const query = queryInput.value.trim();
            if (!query) return;
            
            if (!activeFilename) {
                appendMessage('assistant', 'Please upload a document first before asking questions.');
                return;
            }

            // Add user message
            appendMessage('user', query);
            queryInput.value = '';
            
            // Add loading indicator
            const loadingId = 'loading-' + Date.now();
            appendLoading(loadingId);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: query, filename: activeFilename })
                });
                
                const data = await response.json();
                
                // Remove loading
                document.getElementById(loadingId).remove();
                
                if (response.ok) {
                    appendMessage('assistant', data.answer, data.sources);
                } else {
                    appendMessage('assistant', `Error: ${data.detail}`);
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('assistant', 'Sorry, there was a network error connecting to the server.');
            }
        }

        function appendMessage(role, text, sources = []) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            let content = `<div class="message-bubble">${text.replace(/\\n/g, '<br>')}</div>`;
            
            if (sources && sources.length > 0) {
                let sourcesHtml = '<div class="sources">';
                sources.forEach((src, idx) => {
                    sourcesHtml += `
                        <div class="source-card">
                            <div class="source-header">
                                <span>[Source ${idx + 1}] ${src.filename}</span>
                                <span>Page ${src.page_number}</span>
                            </div>
                            <div class="source-text">${src.text}</div>
                        </div>
                    `;
                });
                sourcesHtml += '</div>';
                content += sourcesHtml;
            }
            
            msgDiv.innerHTML = content;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoading(id) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message assistant`;
            msgDiv.id = id;
            msgDiv.innerHTML = `
                <div class="message-bubble">
                    <div class="loading">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
