version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: liora_user
      POSTGRES_PASSWORD: liora_password
      POSTGRES_DB: liora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liora_user -d liora"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://liora_user:liora_password@db:5432/liora
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
